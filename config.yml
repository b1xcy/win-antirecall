# WeChat 4 Windows anti-recall
# Click WeChatAntiRecall.exe: start WeChat, wait for login, inject hook.

# Custom revoke tip. Placeholders: {from} {time} {content}
tip_phrase: "已拦截 {from} 于 {time} 撤回：{content}"

# Also intercept your own recalls
anti_revoke_self: true

# Kill updater processes, deny Users execute on updater binaries,
# lock %APPDATA%\Tencent\xwechat update/UpdateNotify dirs, disable scheduled update tasks,
# replace WeixinUpdate.exe with a stub when possible, and block in-app new-version prompts
block_update: true

# Bottom-right popup after inject finishes
notify: false

# Write RevokeHook.log next to WeChatAntiRecall.exe
debug: true

# Show Windows notification when receiving new messages
notify_new_message: true

# Dump every unique message object/argument to RevokeHook.log for offset analysis
notify_dump_all: false

# Send this exact text once to locate the正文 std::string field in the dump
notify_probe_text: "__WA_NOTIFY_PROBE_7F3A__"

name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的已有 Git 标签（例如 v1.0.0）"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_ARCHIVE: win-antirecall-${{ inputs.tag || github.ref_name }}-win-x64.zip

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9A-Za-z][0-9A-Za-z._+-]*$') {
            throw "Release tag must start with v and be safe for use in a file name: $env:RELEASE_TAG"
          }

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Locate Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "Visual Studio with C++ tools was not found" }
          "VS_PATH=$vsPath" >> $env:GITHUB_ENV

      - name: Build
        shell: cmd
        run: |
          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1

          msbuild "native\RevokeHook\RevokeHook.sln" /m /p:Configuration=Release /p:Platform=x64 /v:minimal || exit /b 1
          cl /nologo /O1 /DUNICODE /D_UNICODE /Fo"native\update_stub.obj" "native\update_stub.c" /link /SUBSYSTEM:WINDOWS /OUT:"native\update_stub.exe" || exit /b 1
          dotnet publish "src\WeChatAntiRecall\WeChatAntiRecall.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o "dist" || exit /b 1

          copy /Y "native\RevokeHook\x64\Release\RevokeHook.dll" "dist\RevokeHook.dll" || exit /b 1
          copy /Y "native\update_stub.exe" "dist\update_stub.exe" || exit /b 1
          copy /Y "config.yml" "dist\config.yml" || exit /b 1
          copy /Y "src\WeChatAntiRecall\Config3.json" "dist\Config3.json" || exit /b 1
          copy /Y "src\WeChatAntiRecall\Res\IcoE.ico" "dist\IcoE.ico" || exit /b 1

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\*" -DestinationPath $env:RELEASE_ARCHIVE -CompressionLevel Optimal

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            gh release upload $env:RELEASE_TAG $env:RELEASE_ARCHIVE --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $env:RELEASE_TAG $env:RELEASE_ARCHIVE --verify-tag --generate-notes --title $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY
          }

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish release $env:RELEASE_TAG"
          }
